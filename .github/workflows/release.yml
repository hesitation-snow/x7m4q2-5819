name: Debug Android APK and iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build tag, for example v1.4.0'
        required: true
        default: v1.4.0
      publish_release:
        description: 'Publish a GitHub Release after building'
        type: boolean
        default: false
      send_telegram:
        description: 'Send APK / IPA to my Telegram bot private chat'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-android:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android release signing Secrets are required for a formal release."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yomiru-release.jks
          store_password="$KEYSTORE_PASSWORD"
          key_alias="$KEY_ALIAS"
          key_password="$KEY_PASSWORD"

          cat > android/key.properties <<EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=yomiru-release.jks
          EOF

      - name: Build release APK (ARM64 only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Verify APK contains only ARM64 native libraries
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk') as apk:
              abis = {name.split('/')[1] for name in apk.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Expected only arm64-v8a, found: {sorted(abis)}')
          print('Verified ARM64-only APK')
          PY

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "yomiru-android-arm64-$RELEASE_TAG.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: yomiru-android-${{ env.RELEASE_TAG }}
          path: yomiru-android-arm64-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error
          retention-days: 90

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Verify iOS app configuration
        run: |
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'UIInterfaceOrientationPortrait' ios/Runner/Info.plist
          grep -q 'UIInterfaceOrientationLandscapeLeft' ios/Runner/Info.plist
          grep -q 'UIInterfaceOrientationLandscapeRight' ios/Runner/Info.plist

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "yomiru-ios-$RELEASE_TAG-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: yomiru-ios-${{ env.RELEASE_TAG }}
          path: yomiru-ios-${{ env.RELEASE_TAG }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  send-telegram:
    name: Send test builds to Telegram
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
          inputs.send_telegram &&
          (needs.build-android.result == 'success' || needs.build-ios.result == 'success') }}
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout notification script
        uses: actions/checkout@v6

      - name: Test notification script
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: yomiru-android-${{ env.RELEASE_TAG }}
          path: telegram-dist

      - name: Download unsigned IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: yomiru-ios-${{ env.RELEASE_TAG }}
          path: telegram-dist

      - name: Send APK and IPA to private chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/send_telegram.py telegram-dist

  publish-release:
    if: github.event_name == 'push' || inputs.publish_release
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: yomiru-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "$RELEASE_TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Yomiru $RELEASE_TAG"             --notes "Android release APK signed with the maintainer-controlled release keystore. The iOS IPA is unsigned and must be signed with Apple Developer credentials before device installation."
