name: Android ARM64 Release CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'shaders/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Verify mixed-access catalog behavior
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test/book_catalog_verifier_test.dart \
            test/mixed_catalog_probe_test.dart \
            test/catalog_pagination_model_test.dart \
            test/book_access_classification_test.dart \
            test/book_access_probe_regression_test.dart \
            test/background_work_test.dart; do
            flutter test --no-pub --concurrency=1 "$test" --reporter expanded --timeout 45s
          done

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yomiru-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=yomiru-release.jks
          EOF

      - name: Build ARM64 Release
        run: flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              abis = {name.split('/')[1] for name in apk.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Expected ARM64 only, found {sorted(abis)}')
          print('Verified ARM64-only native libraries')
          PY
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/yomiru-arm64-release-${GITHUB_SHA:0:7}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v6
        with:
          name: yomiru-arm64-release-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/yomiru-release.jks
